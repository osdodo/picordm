[package]
name = "picordm"
version = "0.5.0"
authors = ["osdodo <dodomatrix@pm.me>"]
edition = "2024"

[dependencies]
ratatui = "0.29.0"
redis = { version = "0.32.7", features = ["tokio-comp", "aio", "json", "tokio-native-tls-comp", "cluster", "cluster-async"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.100"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3"
edtui = "0.9"
arboard = "3.6.1"
chrono = "0.4.42"
dirs = "6.0"
unicode-width = "0.2.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
